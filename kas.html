<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kas T. Kallie — DeXM Management</title>
<meta name="description" content="Kas T. Kallie, Operating Partner at DeXM Management. Digital business card.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== Same design tokens as the main DeXM site ===== */
  :root{
    --bg:#080B12;
    --bg-alt:#0B0F19;
    --panel-solid:#111726;
    --panel-raised:#151D30;
    --line:#232C42;
    --line-soft:#1A2135;
    --text-1:#EEF0F4;
    --text-2:#9CA6BC;
    --text-3:#5E6880;
    --gold:#C6A15B;
    --gold-dim:#8A7143;
    --green:#5FAE84;
    --serif:'Source Serif 4', Georgia, serif;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', 'SF Mono', monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;cursor:pointer;}

  body{
    background:var(--bg);
    color:var(--text-1);
    font-family:var(--sans);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px;
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse 700px 500px at 50% -10%, rgba(198,161,91,.10), transparent 60%),
      linear-gradient(180deg, var(--bg-alt), var(--bg) 65%);
    z-index:-1;
  }

  /* ===== Card ===== */
  .card{
    width:100%;
    max-width:360px;
    aspect-ratio:5/7;
    background:var(--panel-solid);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.6);
  }

  /* subtle top accent line, echoes site's gold rule motif */
  .card::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .card-inner{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:44px 30px 36px;
    gap:22px;
  }

  /* logo mark: gold-outlined square with X glyph */
  .logo-mark{
    width:72px;height:72px;
    border:1.5px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:2px;
  }
  .logo-mark svg{width:38px;height:38px;display:block;}

  .logo-word{
    font-family:var(--serif);
    font-weight:600;
    font-size:22px;
    line-height:1.4;
    letter-spacing:.02em;
    color:var(--white,#fff);
  }
  .logo-sub{
    font-family:var(--mono);
    font-size:10px;
    line-height:1.6;
    letter-spacing:.28em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:8px;
  }

  .id-block{margin-top:6px;}
  .card-name{
    font-family:var(--serif);
    font-weight:600;
    font-size:23px;
    letter-spacing:.01em;
    color:#fff;
  }
  .card-role{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--gold);
    margin-top:8px;
  }
  .card-rule{
    width:40px;height:1px;
    background:var(--gold-dim);
    margin:18px auto 0;
  }

  /* ===== Actions ===== */
  .actions{
    width:100%;
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--line);
  }
  .action-btn{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 30px;
    font-family:var(--mono);
    font-size:12.5px;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:var(--text-2);
    border-bottom:1px solid var(--line-soft);
    transition:background .2s ease, color .2s ease;
    background:none;
    width:100%;
    text-align:left;
  }
  .action-btn:last-child{border-bottom:none;}
  .action-btn:hover{background:var(--panel-raised);color:var(--text-1);}
  .action-btn .ico{
    width:16px;height:16px;flex-shrink:0;
    color:var(--gold);
  }
  .action-btn .ico svg{width:100%;height:100%;}
  .action-btn.primary{color:var(--gold);}
  .action-btn.primary .ico{color:var(--gold);}

  .card-foot{
    padding:14px 30px;
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:.06em;
    color:var(--text-3);
    text-align:center;
    border-top:1px solid var(--line);
  }

  @media(max-width:400px){
    .card{max-width:100%;aspect-ratio:auto;min-height:640px;}
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-inner">
    <div class="logo-mark">
      <!-- DeXM X glyph -->
      <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <polygon points="0,0 14,0 40,40 26,40" fill="#EEF0F4"/>
        <polygon points="40,0 26,0 0,40 14,40" fill="#C6A15B"/>
      </svg>
    </div>
    <div>
      <p class="logo-word">DeXM</p>
      <p class="logo-sub">Management</p>
    </div>

    <div class="id-block">
      <p class="card-name">Kas T. Kallie</p>
      <p class="card-role">Operating Partner</p>
      <div class="card-rule"></div>
    </div>
  </div>

  <div class="actions">
    <a class="action-btn primary" href="#" id="saveContactBtn">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v14m0 0l-5-5m5 5l5-5M4 21h16"/></svg></span>
      Save Contact
    </a>
    <a class="action-btn" href="tel:+19175230461">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z"/></svg></span>
      Call
    </a>
    <a class="action-btn" href="mailto:kas@dexm-m.com">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h18v14H3V5z"/><path d="M3 6l9 7 9-7"/></svg></span>
      Email
    </a>
    <a class="action-btn" href="https://www.linkedin.com/in/kaskallie" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 5a2 2 0 11-4-.002 2 2 0 014 .002zM7 8.48H3V21h4V8.48zM13.5 8.48H9.75V21h3.7v-6.3c0-1.67.32-3.28 2.38-3.28 2.03 0 2.06 1.9 2.06 3.39V21H21.5v-7.06c0-3.7-.8-6.56-5.13-6.56-2.08 0-3.47 1.14-4.04 2.22h-.06V8.48h-3v0z"/></svg></span>
      LinkedIn
    </a>
    <a class="action-btn" href="https://www.dexm-m.com/index.html">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9S9.5 5.5 12 3z"/></svg></span>
      Website
    </a>
  </div>

  <div class="card-foot">DEXM-M.COM &nbsp;·&nbsp; NEW YORK, NY</div>
</div>

<script>
  document.getElementById('saveContactBtn').addEventListener('click', function(e){
    e.preventDefault();
    var vcard = [
      'BEGIN:VCARD',
      'VERSION:3.0',
      'N:Kallie;Kas;T.;;',
      'FN:Kas T. Kallie',
      'ORG:DeXM Management',
      'TITLE:Operating Partner',
      'TEL;TYPE=CELL:+1 917 523 0461',
      'EMAIL;TYPE=WORK:kas@dexm-m.com',
      'URL:https://www.dexm-m.com',
      'URL;TYPE=LinkedIn:https://www.linkedin.com/in/kaskallie',
      'ADR;TYPE=WORK:;;;New York;NY;;USA',
      'END:VCARD'
    ].join('\r\n');

    var blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'Kas-Kallie-DeXM.vcf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>

</body>
</html>
