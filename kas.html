<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas T. Kallie — DeXM Management</title>
  <meta name="description" content="Kas T. Kallie, Operating Partner at DeXM Management. Digital business card.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <script src="script.js"></script>
  <style>
    :root {
      --bg: #080B12;
      --bg-alt: #0B0F19;
      --panel-solid: #111726;
      --panel-raised: #151D30;
      --line: #232C42;
      --line-soft: #1A2135;
      --text-1: #EEF0F4;
      --text-2: #9CA6BC;
      --text-3: #5E6880;
      --gold: #C6A15B;
      --gold-dim: #8A7143;
      --gold-soft: rgba(198, 161, 91, .13);
      --serif: 'Source Serif 4', Georgia, serif;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono: 'IBM Plex Mono', 'SF Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    body {
      background: var(--bg);
      color: var(--text-1);
      font-family: var(--sans);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 700px 500px at 50% -10%, rgba(198, 161, 91, .10), transparent 60%),
        linear-gradient(180deg, var(--bg-alt), var(--bg) 65%);
      z-index: -1;
    }

    .card {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 5/7;
      background: var(--panel-solid);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .6);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .card-inner {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 44px 30px 36px;
      gap: 22px;
    }

    /* Gold square logo treatment */
    .logo-mark {
      width: 72px;
      height: 72px;
      border: 1.5px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2px;
      background: rgba(198, 161, 91, .025);
    }

    .logo-mark svg {
      width: 38px;
      height: 38px;
      display: block;
    }

    .logo-word {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 22px;
      line-height: 1.4;
      letter-spacing: .02em;
      color: #fff;
    }

    .logo-sub {
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 8px;
    }

    .id-block {
      margin-top: 6px;
    }

    .card-name {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 23px;
      letter-spacing: .01em;
      color: #fff;
    }

    .card-role {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: 8px;
    }

    .card-rule {
      width: 40px;
      height: 1px;
      background: var(--gold-dim);
      margin: 18px auto 0;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      border-top: 0;
      border-bottom: 0;
      background: transparent;
    }

    .action-btn {
      display: grid;
      grid-template-columns: 24px minmax(72px, 1fr) auto;
      align-items: center;
      column-gap: 12px;
      position: relative;
      overflow: hidden;
      padding: 14px 30px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .045em;
      text-transform: uppercase;
      color: var(--text-2);
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      transition:
        background .22s ease,
        color .22s ease,
        border-color .22s ease;
      background: none;
      width: 100%;
      text-align: left;
    }

    .action-btn:last-child {
      border-bottom: none;
    }

    /* Subtle cursor-following shine: gold tint, while text remains mostly white. */
    .action-btn::after {
      content: "";
      position: absolute;
      top: -80%;
      left: -70%;
      width: 42%;
      height: 260%;
      background: linear-gradient(105deg,
          transparent 0%,
          rgba(255, 255, 255, .03) 35%,
          rgba(198, 161, 91, .20) 50%,
          rgba(255, 255, 255, .04) 65%,
          transparent 100%);
      transform: translateX(-120%) rotate(10deg);
      transition: transform .55s ease;
      pointer-events: none;
    }

    .action-btn:hover {
      background:
        linear-gradient(90deg, rgba(198, 161, 91, .10), rgba(198, 161, 91, .045) 58%, rgba(255, 255, 255, .018));
      color: #fff;
      border-bottom-color: rgba(198, 161, 91, .25);
    }

    .action-btn:hover::after {
      transform: translateX(420%) rotate(10deg);
    }

    .action-btn:focus-visible {
      outline: none;
      box-shadow: none;
    }

    .action-btn .ico {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--gold);
      position: relative;
      z-index: 1;
    }

    .action-btn .ico svg {
      width: 100%;
      height: 100%;
    }

    .action-label,
    .action-value {
      position: relative;
      z-index: 1;
    }

    .action-label {
      color: inherit;
      font-weight: 500;
    }

    .action-value {
      color: #D8DCE5;
      text-transform: none;
      letter-spacing: 0;
      font-family: var(--sans);
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
      cursor: pointer;
      transition: color .2s ease;
    }

    .action-btn:not(.primary) .action-value:hover {
      color: var(--gold);
    }

    .action-btn.primary {
      color: var(--gold);
      background: rgba(198, 161, 91, .035);
      border-top: 0;
      border-left: 0;
      border-right: 0;
      border-bottom-color: transparent;
      box-shadow: none;
    }

    .action-btn.primary .ico {
      color: var(--gold);
    }

    .action-btn.primary .action-value {
      color: var(--text-3);
      font-family: var(--mono);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .045em;
    }

    .copy-status {
      position: absolute;
      left: 30px;
      bottom: -18px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      transition: opacity .2s ease, transform .2s ease;
      transform: translateY(4px);
      pointer-events: none;
      white-space: nowrap;
    }

    .copy-status.show {
      opacity: 1;
      transform: translateY(0);
    }

    .card-foot {
      padding: 14px 30px;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: .06em;
      color: var(--text-3);
      text-align: center;
      border-top: 1px solid var(--line);
    }

    /* Optional site-header treatment to use on the main DeXM pages. */
    .site-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 18px;
    }

    .site-logo-mark {
      width: 34px;
      height: 34px;
      border: 1px solid var(--gold);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(198, 161, 91, .035);
    }

    .site-logo-mark svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    @media(max-width:400px) {
      .card {
        max-width: 100%;
        aspect-ratio: auto;
        min-height: 640px;
      }

      .action-btn {
        padding-left: 22px;
        padding-right: 22px;
      }

      .action-value {
        font-size: 10.5px;
      }
    }

    @media(max-width:340px) {
      .action-btn {
        grid-template-columns: 22px minmax(64px, 1fr);
      }

      .action-value {
        grid-column: 2;
        grid-row: 2;
        text-align: left;
        margin-top: 2px;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="card-inner">
      <div class="logo-mark" aria-label="DeXM Management logo">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <polygon points="0,0 14,0 40,40 26,40" fill="#EEF0F4" />
          <polygon points="40,0 26,0 0,40 14,40" fill="#C6A15B" />
        </svg>
      </div>

      <div>
        <p class="logo-word">DeXM</p>
        <p class="logo-sub">Management</p>
      </div>

      <div class="id-block">
        <p class="card-name">Kas T. Kallie</p>
        <p class="card-role">Operating Partner</p>
        <div class="card-rule"></div>
      </div>
    </div>

    <div class="actions">
      <button class="action-btn primary" type="button" id="saveContactBtn" aria-label="Copy contact information">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">

          </svg>
        </span>
        <span class="action-label">Save Contact</span>
        <span class="action-value">Copy contact card</span>
      </button>

      <a class="action-btn" href="tel:+19175230461" aria-label="Call Kas T. Kallie">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path
              d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.4 0 .8-.3 1L6.6 10.8z" />
          </svg>
        </span>
        <span class="action-label">Call</span>
        <span class="action-value">+1 917 523 0461</span>
      </a>

      <a class="action-btn" href="mailto:kas@dexm-m.com" aria-label="Email Kas T. Kallie">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 5h18v14H3V5z" />
            <path d="M3 6l9 7 9-7" />
          </svg>
        </span>
        <span class="action-label">Email</span>
        <span class="action-value">kas@dexm-m.com</span>
      </a>

      <a class="action-btn" href="https://www.linkedin.com/in/kaskallie" target="_blank" rel="noopener"
        aria-label="Open Kas T. Kallie's LinkedIn">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M6.94 5a2 2 0 11-4-.002 2 2 0 014 .002zM7 8.48H3V21h4V8.48zM13.5 8.48H9.75V21h3.7v-6.3c0-1.67.32-3.28 2.38-3.28 2.03 0 2.06 1.9 2.06 3.39V21H21.5v-7.06c0-3.7-.8-6.56-5.13-6.56-2.08 0-3.47 1.14-4.04 2.22h-.06V8.48h-3v0z" />
          </svg>
        </span>
        <span class="action-label">LinkedIn</span>
        <span class="action-value">kaskallie</span>
      </a>

      <a class="action-btn" href="https://www.dexm-m.com/index.html" aria-label="Open DeXM Management website">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.5 2.5 3.8 5.7 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.7-3.8-9S9.5 5.5 12 3z" />
          </svg>
        </span>
        <span class="action-label">Website</span>
        <span class="action-value">dexm-m.com</span>
      </a>

      <span class="copy-status" id="copyStatus" aria-live="polite">Contact table copied</span>
    </div>

    <div class="card-foot">DEXM-M.COM &nbsp;·&nbsp; NEW YORK, NY</div>
  </div>

  <!-- Contact card copy functionality is handled by script.js -->

</body>

</html>
